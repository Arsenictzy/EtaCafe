<!DOCTYPE html>
<!--
  PAGE: Track Order Status (FR-10)
  FILE: frontend-pelanggan/pages/track.html
  Melacak status real-time pesanan berdasarkan ID order
-->
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EtaCafe — Lacak Pesanan</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    .track-page {
      max-width: 600px;
      margin: 48px auto;
      padding: 0 24px;
    }
    .track-page h1 {
      font-size: 28px;
      font-weight: 900;
      color: var(--brown-dark);
      margin-bottom: 8px;
    }
    .track-page .order-num {
      font-size: 15px;
      color: var(--text-light);
      margin-bottom: 28px;
    }
    .status-timeline {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin-bottom: 28px;
    }
    .status-step {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding-bottom: 24px;
      position: relative;
    }
    .status-step:not(:last-child)::after {
      content: '';
      position: absolute;
      left: 17px;
      top: 36px;
      width: 2px;
      height: calc(100% - 12px);
      background: var(--cream-dark);
    }
    .status-step.done::after { background: var(--brown-mid); }
    .step-dot {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 3px solid var(--cream-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      background: var(--white);
      z-index: 1;
    }
    .status-step.done .step-dot {
      border-color: var(--brown-mid);
      background: var(--brown-mid);
      color: white;
    }
    .status-step.current .step-dot {
      border-color: var(--brown-mid);
      animation: pulse 1.2s ease infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(123,74,30,0.35); }
      50%      { box-shadow: 0 0 0 8px rgba(123,74,30,0); }
    }
    .step-content { padding-top: 4px; }
    .step-label { font-size: 15px; font-weight: 700; color: var(--text-dark); }
    .step-time  { font-size: 12px; color: var(--text-light); margin-top: 2px; }
    .btn-cancel {
      background: transparent;
      border: 1.5px solid #e74c3c;
      color: #e74c3c;
      border-radius: 50px;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-right: 12px;
    }
    .btn-cancel:hover { background: #e74c3c; color: white; }
    .action-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .refresh-btn {
      background: var(--brown-mid);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .refresh-btn:hover { background: var(--brown-dark); }
  </style>
</head>
<body>

<div class="page-wrapper">
  <nav class="navbar">
    <span class="navbar-logo">Coffee Shop</span>
    <div class="navbar-links">
      <a href="products.html">Products</a>
      <a href="cart.html">Checkout</a>
    </div>
  </nav>
  <div class="nav-divider"></div>

  <main class="main-content">
    <div class="track-page">
      <div id="loading" class="loading-state"><div class="spinner"></div>Memuat status pesanan...</div>
      <div id="content" style="display:none;">
        <h1>🔍 Lacak Pesanan</h1>
        <div class="order-num" id="order-num-display"></div>

        <div class="status-timeline" id="timeline"></div>

        <div class="action-row">
          <button class="btn-cancel" id="cancel-btn" onclick="cancelOrder()" style="display:none;">
            ✕ Batalkan Pesanan
          </button>
          <button class="refresh-btn" onclick="loadOrder()">🔄 Refresh Status</button>
          <a href="products.html" style="font-size:14px; color:var(--text-light); text-decoration:underline;">← Kembali ke Menu</a>
        </div>
      </div>
      <div id="error" style="display:none;" class="empty-state">⚠️ Pesanan tidak ditemukan.</div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-brand">
      <span class="footer-brand-logo">Coffee Shop</span>
      <span class="footer-brand-tagline">one Stop | one Heart | one Cup</span>
    </div>
    <div class="footer-links">
      <a href="home.html" class="footer-pill" id="footer-btn-company">our Company</a>
      <a href="products.html?type=coffee" class="footer-pill" id="footer-btn-coffee">our Coffee</a>
      <a href="products.html?type=pastry" class="footer-pill" id="footer-btn-pastry">our Pastry</a>
    </div>
    <div class="footer-copy">@ 2023 All Rights Reserved</div>
  </footer>
</div>

<script type="module">
  import { getOrderStatus, cancelOrder as cancelOrderApi } from '../api.js';

  if (!localStorage.getItem('etacafe_user')) location.href = 'login.html';

  window.loadOrder   = loadOrder;
  window.cancelOrder = cancelOrder;

  const params  = new URLSearchParams(location.search);
  const orderId = params.get('id');
  if (!orderId) { showError(); }

  const STEPS = [
    { key: 'created',    label: 'Pesanan Dibuat',             icon: '📝', time_key: 'created_at' },
    { key: 'confirmed',  label: 'Dikonfirmasi Kasir',         icon: '✅', time_key: 'confirmed_at' },
    { key: 'processing', label: 'Sedang Diproses Dapur',      icon: '👨‍🍳', time_key: 'processing_at' },
    { key: 'completed',  label: 'Selesai & Siap Disajikan',   icon: '🍽️', time_key: 'completed_at' },
  ];

  const STATUS_MAP = {
    'Menunggu Konfirmasi Kasir': 0,
    'Dikonfirmasi':              1,
    'Sedang Diproses':           2,
    'Selesai':                   3,
    'Dibatalkan':               -1,
  };

  async function loadOrder() {
    document.getElementById('loading').style.display = '';
    document.getElementById('content').style.display = 'none';
    document.getElementById('error').style.display   = 'none';

    try {
      const order = await getOrderStatus(orderId);
      renderOrder(order);
    } catch {
      showError();
    }
  }

  function renderOrder(order) {
    document.getElementById('order-num-display').textContent =
      `Nomor Pesanan: ${order.order_number} | ${order.status}`;

    const currentStep = STATUS_MAP[order.status] ?? 0;
    const isCancelled = order.status === 'Dibatalkan';

    const timelineEl = document.getElementById('timeline');
    timelineEl.innerHTML = '';

    if (isCancelled) {
      timelineEl.innerHTML = `
        <div class="status-step done">
          <div class="step-dot">❌</div>
          <div class="step-content">
            <div class="step-label" style="color:#e74c3c;">Pesanan Dibatalkan</div>
            <div class="step-time">${formatDateTime(order.cancelled_at)}</div>
          </div>
        </div>`;
    } else {
      STEPS.forEach((step, idx) => {
        let cls = '';
        if (idx < currentStep) cls = 'done';
        else if (idx === currentStep) cls = 'current';

        const timeVal = order[step.time_key];
        timelineEl.innerHTML += `
          <div class="status-step ${cls}">
            <div class="step-dot">${cls === 'done' ? '✓' : step.icon}</div>
            <div class="step-content">
              <div class="step-label">${step.label}</div>
              ${timeVal ? `<div class="step-time">${formatDateTime(timeVal)}</div>` : ''}
            </div>
          </div>`;
      });
    }

    /* Cancel btn: show only if still "Menunggu Konfirmasi Kasir" */
    const cancelBtn = document.getElementById('cancel-btn');
    cancelBtn.style.display = order.status === 'Menunggu Konfirmasi Kasir' ? '' : 'none';

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = '';
  }

  function formatDateTime(dt) {
    if (!dt) return '';
    return new Date(dt).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
  }

  async function cancelOrder() {
    if (!confirm('Yakin ingin membatalkan pesanan ini?')) return;
    try {
      const { cancelOrder: api } = await import('../api.js');
      await api(orderId);
      loadOrder();
    } catch (e) {
      alert('Gagal membatalkan: ' + e.message);
    }
  }

  function showError() {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display   = '';
  }

  loadOrder();
</script>
</body>
</html>
